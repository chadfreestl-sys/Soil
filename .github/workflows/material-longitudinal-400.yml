name: 400 longitudinal material scenarios
on:
  push:
    paths:
      - '.github/workflows/material-longitudinal-400.yml'
      - 'tests/material-longitudinal-400.cjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-400:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Run longitudinal browser tests
        run: node tests/material-longitudinal-400.cjs
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longitudinal-400-results
          path: audit/material-longitudinal-400-results.json
      - name: Commit results
        if: always()
        run: |
          if [ -f audit/material-longitudinal-400-results.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add audit/material-longitudinal-400-results.json
            git commit -m "Test: record 400 longitudinal material scenarios" || exit 0
            git push
          fi
