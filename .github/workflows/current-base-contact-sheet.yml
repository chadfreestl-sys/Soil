name: Current BASE image visual audit
on:
  push:
    paths:
      - '.github/workflows/current-base-contact-sheet.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Create four-image contact sheet
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          from pathlib import Path
          import hashlib, json
          ids = (1,18,23,37)
          width, height = 850, 420
          sheet = Image.new('RGB',(width*2,height*2),'#f1f4ee')
          metadata=[]
          for i,n in enumerate(ids):
              path=Path(f'assets/turfarium/BASE{n:02d}/BASE{n:02d}.webp')
              if not path.is_file(): raise FileNotFoundError(path)
              with Image.open(path) as im:
                  im.load()
                  dims=im.size
                  rgb=ImageOps.contain(im.convert('RGB'),(width-20,height-65))
              x=(i%2)*width
              y=(i//2)*height
              sheet.paste(rgb,(x+(width-rgb.width)//2,y+48))
              ImageDraw.Draw(sheet).text((x+20,y+15),f'BASE{n:02d} — current GitHub main',fill='#172e1e')
              metadata.append(dict(id=f'BASE{n:02d}',path=str(path),size=path.stat().st_size,dimensions=dims,sha256=hashlib.sha256(path.read_bytes()).hexdigest()))
          dest=Path('audit/current-base-four-contact-sheet.jpg')
          dest.parent.mkdir(exist_ok=True)
          sheet.save(dest,quality=91)
          Path('audit/current-base-four-metadata.json').write_text(json.dumps(metadata,indent=2)+'\n')
          print(json.dumps(metadata,indent=2))
          PY
      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: current-base-four-contact-sheet
          path: |
            audit/current-base-four-contact-sheet.jpg
            audit/current-base-four-metadata.json
      - name: Commit contact sheet to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/current-base-four-contact-sheet.jpg audit/current-base-four-metadata.json
          git commit -m "Audit: publish current BASE01,18,23,37 contact sheet" || exit 0
          git push
