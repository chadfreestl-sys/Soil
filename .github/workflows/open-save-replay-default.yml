name: Open Save Compare and Replay by default
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/open-save-replay-default.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update default-open panels and cache bust layout tools
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('layout-tools.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("const VERSION='23.4';","const VERSION='23.5';",1)
          old="const defaultOpenPanel=panel=>panel===lawnA||panel===lawnB||panel===deck||panel===findManagementPanel()||panel===timeline;"
          new="const defaultOpenPanel=panel=>panel===lawnA||panel===lawnB||panel===deck||panel===findManagementPanel()||panel===timeline||panel.id==='scenario-memory'||panel.classList.contains('tf-replay-bar');"
          if old not in s and new not in s:
              raise SystemExit('defaultOpenPanel target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          h=Path('lab.html')
          t=h.read_text(encoding='utf-8')
          t=re.sub(r'layout-tools\.js\?v=[^"\']+','layout-tools.js?v=23.5',t)
          h.write_text(t,encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add layout-tools.js lab.html
          git commit -m "Open Save Compare and Replay by default"
          git push
