name: Import Living Soil Lab v19.3

on:
  push:
    paths:
      - '.github/workflows/import-v19.yml'
      - 'living_soil_lab_v19_3_interaction_fix_netlify (1).zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-v19:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract v19.3
        shell: bash
        run: |
          rm -rf .import-v19
          mkdir .import-v19
          unzip -o 'living_soil_lab_v19_3_interaction_fix_netlify (1).zip' -d .import-v19
          INDEX_PATH="$(find .import-v19 -type f -name index.html | head -n 1)"
          if [ -z "$INDEX_PATH" ]; then
            echo 'No index.html found in uploaded v19.3 ZIP' >&2
            exit 1
          fi
          cp "$INDEX_PATH" ./index.html
          rm -rf .import-v19

      - name: Commit imported simulator
        shell: bash
        run: |
          if git diff --quiet -- index.html && [ -f index.html ]; then
            echo 'index.html already matches extracted v19.3'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Import Living Soil Lab v19.3 baseline'
          git push
