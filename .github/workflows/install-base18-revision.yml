name: Install approved BASE18 revision
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-base18-revision.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and install revised BASE18
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          archive=Path('Turfarium_BASE18_Revision_GitHub_Upload.zip')
          assert archive.is_file(), 'Revision ZIP missing'
          with zipfile.ZipFile(archive) as z:
              names=[n for n in z.namelist() if n.lower().endswith('.webp') and not n.startswith('__MACOSX/')]
              assert len(names)==1, f'Expected exactly one WebP revision, found {names}'
              data=z.read(names[0])
          assert len(data)>10000 and data[:4]==b'RIFF' and data[8:12]==b'WEBP', 'Invalid WebP image'
          target=Path('assets/turfarium/BASE18/BASE18.webp')
          assert target.is_file(), 'Original BASE18 missing'
          if target.read_bytes()==data:
              print('BASE18 already installed')
          else:
              target.write_bytes(data)
              print(f'Installed {names[0]} -> {target} ({len(data)} bytes)')
          PY
      - name: Commit replacement to main
        run: |
          if git diff --quiet -- assets/turfarium/BASE18/BASE18.webp; then echo 'No change needed'; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/turfarium/BASE18/BASE18.webp
          git commit -m "Install approved revised BASE18 scientific image"
          git push origin HEAD:main
