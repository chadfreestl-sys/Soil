name: Brand Turfarium

on:
  push:
    paths:
      - '.github/workflows/brand-turfarium.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename product to Turfarium
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ['index.html','audience-selector.html','inviting-theme.js','audience-modes.js','scenario-tools.js','lab.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=s.replace('Living Turf Lab','Turfarium').replace('Living Soil Lab','Turfarium')
              if name=='index.html':
                  s=s.replace('<title>Turfarium | Turf Ecosystem Simulator</title>','<title>Turfarium | Interactive Turf Ecosystem Simulator</title>')
                  s=s.replace('Interactive turf + soil ecosystem simulator','Interactive turf ecosystem simulator')
                  s=s.replace('Turfarium is built to make a complicated turf-and-soil system feel understandable.','Turfarium is an interactive turf ecosystem simulator built to make a complicated turf-and-soil system feel understandable.')
              p.write_text(s,encoding='utf-8')

          p=Path('.github/workflows/restore-v19-5-lab.yml')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              s=s.replace('name: Restore Living Soil Lab v19.8','name: Restore Turfarium v19.8')
              s=s.replace("'<title>Living Soil Lab v19.8 | Nature Studio Experience</title>'","'<title>Turfarium | Interactive Turf Ecosystem Simulator</title>'")
              s=s.replace("p.write_text(s,encoding='utf-8')","s=s.replace('Living Soil Lab','Turfarium')\n          p.write_text(s,encoding='utf-8')")
              s=s.replace('Upgrade Living Soil Lab to v19.8 nature studio experience','Upgrade Turfarium v19.8 nature studio experience')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit Turfarium branding
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'Brand already updated'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html audience-selector.html inviting-theme.js audience-modes.js scenario-tools.js lab.html .github/workflows/restore-v19-5-lab.yml
          git commit -m 'Rename product to Turfarium'
          git push
