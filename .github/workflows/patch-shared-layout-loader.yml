name: Patch shared-start loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-shared-layout-loader.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch lab loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('lab.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'turfarium-clean-photo\.js\?v=[^"\']+', 'turfarium-clean-photo.js?v=3.2', s)
          s = re.sub(r'turfarium-shared-start-layout-v1\.js\?v=[^"\']+', 'turfarium-shared-start-layout-v1.js?v=3.0.0', s)
          s = re.sub(r'inviting-theme\.js\?v=[^"\']+', 'inviting-theme.js?v=20.6', s)
          s = re.sub(r'turfarium-science-pairs-v1\.js\?v=[^"\']+', 'turfarium-science-pairs-v1.js?v=1.0.0', s)
          shared_tag = '<script defer src="turfarium-shared-start-layout-v1.js?v=3.0.0"></script>'
          science_tag = '<script defer src="turfarium-science-pairs-v1.js?v=1.0.0"></script>'
          if 'turfarium-shared-start-layout-v1.js' not in s:
              s = s.replace('</body></html>', shared_tag + '</body></html>')
          if 'turfarium-science-pairs-v1.js' not in s:
              s = s.replace('</body></html>', science_tag + '</body></html>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lab.html
          git commit -m 'Load paired science modules layout'
          git push
