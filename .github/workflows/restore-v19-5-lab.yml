name: Restore Living Soil Lab v19.8

on:
  push:
    paths:
      - '.github/workflows/restore-v19-5-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore evidence build and add v19.8 layers
        shell: bash
        run: |
          git show ad0b7b53a32c383d9113ac282da0571cc4b3afac:index.html > lab.html
          python - <<'PY'
          from pathlib import Path
          p=Path('lab.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<title>Living Soil Lab v19.4 | Evidence & Confidence Layer</title>','<title>Living Soil Lab v19.8 | Nature Studio Experience</title>',1)
          for css in ['audience-modes.css','scenario-tools.css','layout-tools.css']:
              if css not in s:
                  s=s.replace('</head>',f'<link rel="stylesheet" href="{css}"></head>',1)
          if 'inviting-theme.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="inviting-theme.css?v=19.8"></head>',1)
          for js in ['audience-modes.js','scenario-tools.js','layout-tools.js']:
              if js not in s:
                  s=s.replace('</body>',f'<script src="{js}"></script></body>',1)
          if 'inviting-theme.js' not in s:
              s=s.replace('</body>','<script src="inviting-theme.js?v=19.8"></script></body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit restored v19.8 lab
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- lab.html)" ]; then
            echo 'lab.html already matches v19.8 layered build'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lab.html
          git commit -m 'Upgrade Living Soil Lab to v19.8 nature studio experience'
          git push
