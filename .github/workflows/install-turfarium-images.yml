name: Install Turfarium images
on:
  push:
    paths:
      - '.github/workflows/install-turfarium-images.yml'
      - 'turfarium-extracted-images.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract images into the expected folder
        run: |
          mkdir -p images
          unzip -o turfarium-extracted-images.zip -d images
          test -s images/homeowner.jpg
          test -s images/technician.jpg
          test -s images/professional.jpg
          test -s images/research.jpg
      - name: Commit installed images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/homeowner.jpg images/technician.jpg images/professional.jpg images/research.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Install four Turfarium photographic experience images"
            git push
          fi
