name: Inspect treatment history markup
on:
  push:
    paths:
      - '.github/workflows/inspect-history.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract matching HTML context
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('lab.html').read_text(encoding='utf-8')
          lines=['HTML bytes '+str(len(s))]
          for m in list(re.finditer(r'treatment\s*(?:history|records)|application\s*history|recent\s*treatments',s,re.I))[:35]:
              lines.append('\nAT '+str(m.start())+'\n'+s[max(0,m.start()-450):m.end()+850])
          Path('history-markup-diagnostic.txt').write_text('\n'.join(lines),encoding='utf-8')
          PY
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history-markup-diagnostic.txt
          git commit -m "Inspect actual treatment history HTML" && git push
