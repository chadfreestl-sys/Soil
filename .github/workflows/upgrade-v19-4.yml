name: Upgrade Living Soil Lab v19.4 Evidence Layer

on:
  push:
    paths:
      - '.github/workflows/upgrade-v19-4.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-v19-4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply tested v19.4 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib, hashlib, sys
          expected_before='e4af9d65fea650ef3c94459d2cbddd6958dd2057d938ae45c0e58c62e90ab8eb'
          expected_after='c5e696dcf062748b3360a0733e004dcb2587d487aabe0c5b9a3c5716214242bb'
          p=Path('index.html')
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          if got==expected_after:
              print('v19.4 already applied')
              sys.exit(0)
          if got!=expected_before:
              print('Unexpected index.html baseline:',got,file=sys.stderr)
              sys.exit(1)
          payload=''
          code=zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          exec(compile(code,'v19_4_patch.py','exec'))
          got=hashlib.sha256(p.read_bytes()).hexdigest()
          print('patched index sha256:',got)
          if got!=expected_after:
              print('Patched file did not match tested build',file=sys.stderr)
              sys.exit(1)
          PY

      - name: Commit v19.4
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- index.html)" ]; then
            echo 'No index.html change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add v19.4 evidence and confidence layer'
          git push
