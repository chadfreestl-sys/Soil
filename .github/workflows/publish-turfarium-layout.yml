name: Publish Turfarium profile-first layout
on:
  push:
    paths:
      - '.github/workflows/publish-turfarium-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Load weather-first controller in live HTML
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('lab.html')
          html=p.read_text(encoding='utf-8')
          html=re.sub(r'layout-tools[.]js[?]v=[0-9.]+','layout-tools.js?v=23.2',html)
          html=re.sub(r'turfarium-v20[.]js[?]v=[0-9.]+','turfarium-v20.js?v=23.2',html)
          html=re.sub(r'turfarium-layout-v21-4[.]css[?]v=[0-9.]+','turfarium-layout-v21-4.css?v=23.2',html)
          script='<script defer src="weather-first-v23.js?v=23.2"></script>'
          html=re.sub(r'<script[^>]+weather-first-v23[.]js[^>]*></script>','',html)
          if '</body>' not in html:
              raise RuntimeError('Missing body end: refusing unsafe HTML change')
          html=html.replace('</body>',script+'\\n</body>',1)
          print('Weather lab ID:',html.count('id="experiment-controls"'))
          print('Profile deck runtime:', 'layout-tools.js' in html)
          print('Weather controller installed:',script in html)
          compact_css='<link rel="stylesheet" href="profile-compact-v23-3.css?v=23.3">'
          compact_js='<script defer src="profile-compact-v23-3.js?v=23.3"></script>'
          html=re.sub(r'<link[^>]*profile-compact-v23-3[.]css[^>]*>','',html)
          html=re.sub(r'<script[^>]*profile-compact-v23-3[.]js[^>]*></script>','',html)
          html=html.replace('</head>',compact_css+'\\n</head>',1)
          html=html.replace('</body>',compact_js+'\\n</body>',1)
          mobile_css='<link rel="stylesheet" href="turfarium-mobile-v23-4.css?v=23.4">'
          html=re.sub(r'<link[^>]*turfarium-mobile-v23-4[.]css[^>]*>','',html)
          html=html.replace('</head>',mobile_css+'\\n</head>',1)
          audience_css='<link rel="stylesheet" href="turfarium-audience-compact-v23-5.css?v=23.5">'
          html=re.sub(r'<link[^>]*turfarium-audience-compact-v23-5[.]css[^>]*>','',html)
          html=html.replace('</head>',audience_css+'\\n</head>',1)
          history_css='<link rel="stylesheet" href="treatment-history-v23-6.css?v=23.9">'
          history_js='<script defer src="treatment-history-v23-6.js?v=23.9"></script>'
          html=re.sub(r'<link[^>]*treatment-history-v23-6[.]css[^>]*>','',html)
          html=re.sub(r'<script[^>]*treatment-history-v23-6[.]js[^>]*></script>','',html)
          html=html.replace('</head>',history_css+'\\n</head>',1)
          html=html.replace('</body>',history_js+'\\n</body>',1)
          for match in list(re.finditer(r'treatment history|recent-applications',html,re.I))[:18]:
              print('HISTORY HTML:',repr(html[max(0,match.start()-320):match.end()+500]))
          detail_css='<link rel="stylesheet" href="turfarium-details-v24.css?v=24.0">'
          detail_js='<script defer src="turfarium-details-v24.js?v=24.0"></script>'
          html=re.sub(r'<link[^>]*turfarium-details-v24[.]css[^>]*>','',html)
          html=re.sub(r'<script[^>]*turfarium-details-v24[.]js[^>]*></script>','',html)
          html=html.replace('</head>',detail_css+'\\n</head>',1)
          html=html.replace('</body>',detail_js+'\\n</body>',1)
          p.write_text(html,encoding='utf-8')
      - name: Commit only the HTML reference update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab.html
          if ! git diff --cached --quiet; then
            git commit -m "Load v23 weather-first controller in Turfarium"
            git push
          fi
