name: Publish Turfarium profile-first layout
on:
  push:
    paths:
      - '.github/workflows/publish-turfarium-layout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch HTML references without touching simulator engine
        shell: python
        run: |
          from pathlib import Path
          p=Path('lab.html')
          html=p.read_text(encoding='utf-8')
          import re
          html=re.sub(r'layout-tools\\.js\\?v=[^"\\\']+', 'layout-tools.js?v=21.9', html)
          html=re.sub(r'turfarium-v20\\.js\\?v=[^"\\\']+', 'turfarium-v20.js?v=21.9', html)
          css='<link rel="stylesheet" href="turfarium-layout-v21-4.css?v=21.9">'
          if 'turfarium-layout-v21-4.css' in html:
              html=re.sub(r'<link[^>]+turfarium-layout-v21-4\\.css[^>]*>',css,html)
          else:
              html=html.replace('</head>',css+'</head>',1)
          p.write_text(html,encoding='utf-8')
      - name: Commit only the HTML reference update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab.html
          if ! git diff --cached --quiet; then
            git commit -m "Load v21.4 profile-first layout on live Turfarium"
            git push
          fi
