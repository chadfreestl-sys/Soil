name: Turfarium v25 browser smoke tests
on:
  push:
    branches: [turfarium-v25-development]
    paths:
      - 'lab.html'
      - 'v25-workspace.js'
      - 'v25-workspace.css'
      - '.github/workflows/v25-browser-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser automation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run mobile and desktop smoke tests
        run: node scripts/v25-browser-smoke.cjs
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turfarium-v25-browser-results
          path: browser-results/
          retention-days: 14
