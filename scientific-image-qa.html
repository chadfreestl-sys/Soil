<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turfarium | Scientific Image QA</title><style>body{font:16px system-ui;background:#10271d;color:#edf7ef;margin:0}header{padding:24px;max-width:1100px;margin:auto}h1{margin:0 0 8px}p{line-height:1.5;color:#c9e0d0}main{max-width:1100px;margin:auto;padding:12px 24px 50px}#status{padding:12px;border:1px solid #567b64;border-radius:8px;margin-bottom:16px}#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}article{background:#203e2c;border:1px solid #55745e;border-radius:12px;overflow:hidden}img{width:100%;aspect-ratio:21/9;object-fit:contain;background:#08130d}article div{padding:12px}small{color:#bcd8c3}input{padding:10px;border-radius:7px;border:1px solid #8da992;background:#fff;color:#172b1c;font-size:16px}a{color:#b8edbd}button{padding:8px;border-radius:6px} .bad{color:#ffb5a9}.ok{color:#a5f0ba}</style></head><body><header><h1>Turfarium · Scientific Image QA</h1><p>Prelaunch visual review. The image filename and scientific meaning must be checked independently before images are assigned to simulation states. This page does not modify simulator calculations.</p><label>Filter image number <input id="filter" type="search" placeholder="e.g. 63 or BASE80"></label></header><main><div id="status" role="status">Loading inventory…</div><section id="grid" aria-label="Scientific image inventory"></section></main><script>(async()=>{'use strict';const grid=document.getElementById('grid'),status=document.getElementById('status'),filter=document.getElementById('filter');try{const response=await fetch('assets/turfarium/image-manifest.json',{cache:'no-store'});if(!response.ok)throw Error('Inventory HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.images)||data.images.length!==88)throw Error('Expected 88 entries');const cards=[];let loaded=0,failed=0;for(const e of data.images){const card=document.createElement('article');const pic=document.createElement('img');pic.loading='lazy';pic.alt=e.id+' scientific lawn and soil cross-section — subject awaiting verification';pic.src=e.path||'';pic.onload=()=>{loaded++;status.textContent='Inventory: 88 · Loaded: '+loaded+' · Failed: '+failed};pic.onerror=()=>{failed++;card.classList.add('bad');status.textContent='Inventory: 88 · Loaded: '+loaded+' · Failed: '+failed};const details=document.createElement('div');const title=document.createElement('strong');title.textContent=e.id;const desc=document.createElement('p');desc.textContent=e.verifiedSubject?e.topic:'Scientific subject awaiting visual review';const path=document.createElement('small');path.textContent=e.path||'MISSING FILE';details.append(title,desc,path);card.append(pic,details);grid.append(card);cards.push([e.id,card]);}filter.addEventListener('input',()=>{const q=filter.value.trim().toUpperCase().replace(/^BASE/,'');for(const [id,card]of cards)card.hidden=!!q&&!id.includes(q.padStart(2,'0'))});status.textContent='Inventory: 88 · Images load as you scroll. Review each scientific subject.'}catch(e){status.className='bad';status.textContent='Image QA cannot start: '+e.message}})();</script></body></html>
